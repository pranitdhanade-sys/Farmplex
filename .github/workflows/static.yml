name: Deploy Farmplex

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        run: |
          mkdir -p site
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='.venv' --exclude='venv' ./ site/
          if [ -f site/preview.html ] && [ ! -f site/index.html ]; then
            cp site/preview.html site/index.html
          fi
          test -f site/index.html || { echo "Error: index.html or preview.html is required"; exit 1; }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
